name: CI/CD Frontend, .NET API & Keycloak

on:
  push:
    branches: [ "cicd" ]

env:
  REGISTRY: hvba-live.programmeren-ap.be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Docker Buildx instellen
        uses: docker/setup-buildx-action@v3

      - name: Inloggen op Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Frontend bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          build-args: |
            VITE_KEYCLOAK_AUTHORITY=${{ secrets.VITE_KEYCLOAK_AUTHORITY }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Backend (.NET) bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
      
      - name: Inloggen op Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Keycloak bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hvba:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hvba:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: hvba-live-runner
    steps:
      - name: Nieuwe images ophalen en containers herstarten
        run: |
          cd C:\pad\naar\jouw\docker-compose-map
          docker compose pull
          docker compose up -d
          docker image prune -f