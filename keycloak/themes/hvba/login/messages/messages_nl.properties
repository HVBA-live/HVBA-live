termsText=<p>HVBA Live is een applicatie die betrokkenen bij een rechtszaak in staat stelt om te volgen welk dossier wanneer behandeld wordt tijdens de zitting. Zo kunnen zij weten wanneer hun dossier aan bod komt.</p>\
<p>Personen die van HVBA Live gebruik wensen te maken, moeten een gebruikersaccount aanmaken en bezorgen daartoe de volgende persoonsgegevens:</p>\
<ul>\
<li>voornaam</li>\
<li>achternaam</li>\
<li>e-mailadres</li>\
<li>telefoonnummer</li>\
</ul>\
<p>Het Hof van Beroep Antwerpen treedt op als verantwoordelijke en gebruikt deze persoonsgegevens uitsluitend om de toegang tot HVBA Live te beheren en beveiligen. Voor deze doeleinden worden tevens loggegevens bijgehouden omtrent het gebruik dat van HVBA Live wordt gemaakt.</p>\
<p>Door op "Accepteren" te klikken, stemt de gebruiker in met de verwerking van voormelde persoonsgegevens. Gebruikers kunnen hun toestemming te allen tijde intrekken, door de verwijdering van hun gebruikersaccount te vragen.</p>\
<p>Daarnaast kunnen gebruikers beroep doen op hun rechten met betrekking tot de persoonsgegevens, in lijn met artikel 12 – 22 GDPR. Meer bepaald kunnen zij een verzoek indienen tot inzage, rectificatie, verwijdering, beperking van verwerking, overdraagbaarheid en bezwaar.</p>\
<p>Deze verzoeken kunnen ingediend worden via het mailadres [e-mail nog aan te vullen].</p>\
<p>De persoonsgegevens worden bewaard zolang het gebruikersaccount actief is. Bij verwijdering van het account worden de gegevens binnen 30 dagen verwijderd, tenzij een langere bewaartermijn wettelijk vereist is.</p>\
<p>Persoonsgegevens worden niet meegedeeld aan derden, tenzij dit wettelijk verplicht is.</p>